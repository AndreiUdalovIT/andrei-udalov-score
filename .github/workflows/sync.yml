name: Sync football data
run-name: >-
  ${{ github.event_name == 'schedule' && 'Scheduled production sync' ||
      format('Manual {0} sync for {1} ({2})',
             inputs.mode, inputs.competitions, inputs.environment) }}

on:
  schedule:
    # UTC. Light every four hours, full daily at a separate time.
    - cron: '17 */4 * * *'
    - cron: '37 1 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      mode:
        description: Sync mode
        required: true
        default: light
        type: choice
        options:
          - light
          - full
      competitions:
        description: Competition codes separated by spaces, e.g. PL CL
        required: true
        default: PL
        type: string

permissions:
  contents: read

concurrency:
  group: football-data-sync
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          vars.SYNC_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: >-
      ${{ github.event_name == 'schedule' && 'production' || inputs.environment }}
    timeout-minutes: 45
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync selected competitions
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SYNC_MODE: ${{ inputs.mode }}
          SYNC_COMPETITIONS: ${{ inputs.competitions }}
          SYNC_SCHEDULE: ${{ github.event.schedule }}
          SCHEDULED_COMPETITIONS: ${{ vars.SYNC_COMPETITIONS }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            case "$SYNC_SCHEDULE" in
              '17 */4 * * *') SYNC_MODE=light ;;
              '37 1 * * *') SYNC_MODE=full ;;
              *)
                echo "Unknown sync schedule." >&2
                exit 2
                ;;
            esac
            SYNC_COMPETITIONS="$SCHEDULED_COMPETITIONS"
          fi

          case "$SYNC_MODE" in
            full|light) ;;
            *)
              echo "Invalid sync mode." >&2
              exit 2
              ;;
          esac

          # Keep competition codes as separate arguments without shell expansion.
          competition_codes=${SYNC_COMPETITIONS//$'\n'/ }
          read -r -a competitions <<< "$competition_codes"
          args=()
          for competition in "${competitions[@]}"; do
            args+=(--competition "$competition")
          done

          pnpm "sync:$SYNC_MODE" "${args[@]}"
